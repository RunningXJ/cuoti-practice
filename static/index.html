<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2744" />
  <title>错题练习</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">错题练习</div>
      <div id="examName" class="sub"></div>
    </header>

    <section id="homeView" class="view">
      <div class="stats-grid" id="homeStats"></div>
      <div class="panel">
        <h2>开始练习</h2>
        <div class="mode-list">
          <button class="mode-btn" data-mode="all"><span class="mode-title">全部错题练习</span><span class="mode-progress" data-progress-for="all"></span></button>
          <button class="mode-btn hot" data-mode="hot"><span class="mode-title">多次错题（≥2次）</span><span class="mode-progress" data-progress-for="hot"></span></button>
          <button class="mode-btn" data-mode="practice-wrong"><span class="mode-title">本次练习错题</span><span class="mode-progress" data-progress-for="practice-wrong"></span></button>
          <button class="mode-btn" data-mode="single"><span class="mode-title">只练单选</span><span class="mode-progress" data-progress-for="single"></span></button>
          <button class="mode-btn" data-mode="multi"><span class="mode-title">只练多选</span><span class="mode-progress" data-progress-for="multi"></span></button>
          <button class="mode-btn" data-mode="judge"><span class="mode-title">只练判断</span><span class="mode-progress" data-progress-for="judge"></span></button>
        </div>
        <p class="hint">有进度的模式会显示「已练 x/y」，再次进入会直接从上次位置继续；全部练完后自动重新开始。</p>
        <label class="checkline"><input type="checkbox" id="shuffleToggle" checked /> 随机顺序</label>
      </div>
      <div class="panel">
        <h2>功能</h2>
        <div class="action-row">
          <button id="btnReviewChopped" class="ghost">已斩题目</button>
          <button id="btnClearPracticeWrong" class="ghost danger">清空练习错题记录</button>
        </div>
        <p class="hint">进度会自动备份到本机浏览器。云端休眠后再次打开同一浏览器会自动恢复；换手机/清缓存会丢失。电脑本地练习仍写入 data 目录。</p>
      </div>
    </section>

    <section id="quizView" class="view hidden">
      <div class="quiz-bar">
        <button id="btnBackHome" class="ghost mini">返回</button>
        <div id="progressText" class="progressive"></div>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      </div>
      <div id="questionCard" class="q-card"></div>
      <div class="quiz-actions">
        <button id="btnPrev" class="ghost">上一题</button>
        <button id="btnSubmit" class="primary">提交答案</button>
        <button id="btnNext" class="primary">下一题</button>
        <button id="btnChop" class="chop">斩题</button>
      </div>
      <div id="feedback" class="feedback hidden"></div>
    </section>

    <section id="resultView" class="view hidden">
      <div class="panel center">
        <h2>本轮结束</h2>
        <div id="resultStats" class="result-stats"></div>
        <div class="action-row">
          <button id="btnRetryWrong" class="primary">重做错题</button>
          <button id="btnToHome" class="ghost">回首页</button>
        </div>
      </div>
    </section>

    <section id="choppedView" class="view hidden">
      <div class="panel">
        <div class="row-between">
          <h2>已斩题目</h2>
          <button id="btnBackFromChopped" class="ghost mini">返回</button>
        </div>
        <div id="choppedList" class="chopped-list"></div>
      </div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
